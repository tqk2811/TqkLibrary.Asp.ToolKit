name: Test

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Tests do not need a real version: skip GitVersion (it fails on branches without a full SemVer tag).
      - name: Test
        run: >
          dotnet test src/TqkLibrary.Asp.ToolKit.slnx -c Release
          -p:DisableGitVersionTask=true -p:Version=0.0.0
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore
