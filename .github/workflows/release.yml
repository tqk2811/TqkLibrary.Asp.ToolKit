name: Release

# Run manually on master (Actions -> Release -> Run workflow) -> test, pack every package with the <VersionPrefix> of
# its csproj, push to nuget.org only the versions nuget.org does not have yet (NuGet Trusted Publishing, OIDC, no API
# key secret), and tag each published version as <Package>/vM.N.P, e.g. Auth.Web/v2.0.0.
# To release a package: bump <VersionPrefix> in its csproj, merge to master, run this workflow.

on:
  workflow_dispatch:

permissions:
  contents: write             # push the per-package tags
  id-token: write             # NuGet/login exchanges the OIDC token for a short-lived API key

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Fail loudly instead of skipping: an all-skipped green run reads like a release that happened.
      - name: Run on master only
        if: github.ref != 'refs/heads/master'
        run: |
          echo "Release must run on master, not ${GITHUB_REF}"
          exit 1

  test:
    needs: check
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0      # existing tags are checked before pushing new ones

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Pack
        shell: pwsh
        run: |
          # Packs every packable project of the solution (test projects have IsPackable=false).
          dotnet pack src/TqkLibrary.Asp.ToolKit.slnx -c Release -p:TqkRelease=true -o artifacts
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Select new versions
        id: select
        shell: pwsh
        run: |
          $prefix = 'TqkLibrary.Asp.ToolKit.'
          $releases = @()
          foreach ($n in Get-ChildItem artifacts -Filter *.nupkg) {
            # <Id>.<M.N.P>.nupkg; the release build never has a prerelease suffix
            if ($n.Name -notmatch '^(?<id>.+)\.(?<ver>\d+\.\d+\.\d+)\.nupkg$') {
              Write-Error "Unexpected package name $($n.Name)"; exit 1
            }
            $id = $Matches.id; $ver = $Matches.ver
            if (-not $id.StartsWith($prefix)) { Write-Error "Package id $id does not start with $prefix"; exit 1 }
            $tag = "$($id.Substring($prefix.Length))/v$ver"
            $published = @()
            try {
              $index = Invoke-RestMethod "https://api.nuget.org/v3-flatcontainer/$($id.ToLowerInvariant())/index.json"
              $published = @($index.versions)
            } catch {
              if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw }   # 404 = package never published
            }
            git rev-parse -q --verify "refs/tags/$tag" *> $null
            $tagged = $LASTEXITCODE -eq 0
            if ($published -contains $ver) {
              # Already released. Without a tag it was published before per-package tags existed (or a previous run
              # failed between push and tag): this commit is not necessarily the published one, so no tag is guessed.
              if (-not $tagged) { Write-Host "skip    $id $ver (already on nuget.org, no tag $tag)" }
              continue
            }
            if ($tagged) { Write-Error "$tag exists but $id $ver is not on nuget.org: bump <VersionPrefix> or delete the tag"; exit 1 }
            $highest = $published | Where-Object { $_ -notmatch '-' } |
              ForEach-Object { [version]$_ } | Sort-Object -Descending | Select-Object -First 1
            if ($highest -and [version]$ver -lt $highest) {
              Write-Error "$id $ver is lower than $highest already on nuget.org"; exit 1
            }
            $releases += "$($n.FullName)|$tag"
            Write-Host "release $id $ver"
          }
          if ($releases.Count -eq 0) { Write-Host 'Nothing to release: every version is already on nuget.org.' }
          $releases | Set-Content releases.txt
          "count=$($releases.Count)" >> $env:GITHUB_OUTPUT

      # NuGet Trusted Publishing: needs a trusted publishing policy on nuget.org (owner tqk2811,
      # repo TqkLibrary.Asp.ToolKit, workflow release.yml). 'user' is the nuget.org profile name, not an email.
      - name: NuGet login (OIDC)
        if: steps.select.outputs.count != '0'
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: tqk2811

      # Tag each package right after its own push, so a failure later in the loop never leaves an already pushed
      # package untagged. Tags are pushed one at a time: GitHub drops the push event when more than 3 arrive at once.
      - name: Push nuget.org and tag
        if: steps.select.outputs.count != '0'
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          foreach ($line in Get-Content releases.txt) {
            if (-not $line) { continue }
            $path, $tag = $line -split '\|', 2
            dotnet nuget push $path --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { Write-Error "Push failed: $path"; exit 1 }
            git tag $tag $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { exit 1 }
            git push origin "refs/tags/$tag"
            if ($LASTEXITCODE -ne 0) { Write-Error "Pushed $path but could not push tag $tag: push it by hand on $env:GITHUB_SHA"; exit 1 }
          }
